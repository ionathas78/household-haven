<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Household Haven | Dragon & Kitten</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#493657;background:#fff6fd}*{box-sizing:border-box}body{margin:0;padding:24px;display:grid;place-items:center;min-height:100vh}main{width:min(100%,640px);background:white;border:2px solid #f0d7f3;border-radius:26px;padding:24px;box-shadow:0 15px 45px #75508b1c}h1{margin:0;font-size:1.65rem}p{color:#786b83}.stage{height:280px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#d7edff,#f9e5fc 72%,#c7e9c6 73%);margin:20px 0}.creature{position:absolute;font-size:75px;bottom:40px;transition:transform .7s ease,left .7s ease,bottom .7s ease;user-select:none}.dragon{left:13%}.kitten{left:62%;cursor:pointer}.speech{position:absolute;top:14px;left:0;right:0;text-align:center;font-weight:700;color:#725394}.controls{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:#7860b4;color:white;cursor:pointer;touch-action:manipulation}button.secondary{background:#f1e8f9;color:#624b80}button:disabled{opacity:.5;cursor:not-allowed}.status{padding:12px;border-radius:12px;background:#f7f2fc;margin:15px 0}.confetti{position:absolute;inset:0;pointer-events:none;opacity:0;background-image:radial-gradient(#ffb443 3px,transparent 4px),radial-gradient(#e88ab8 3px,transparent 4px),radial-gradient(#80baf3 3px,transparent 4px);background-size:55px 55px,71px 71px,93px 93px}.celebrate .confetti{animation:glitter 1.4s 1}.celebrate .kitten{animation:leap 3.8s ease-in-out 1}.celebrate .dragon{animation:flight 3.8s ease-in-out 1}.pet .kitten{animation:wiggle .6s ease-in-out 1}.bunny .kitten:after{content:'🐰';position:absolute;font-size:33px;top:-12px;left:16px}.bunny .kitten{filter:drop-shadow(0 0 5px pink)}@keyframes wiggle{25%{transform:rotate(-15deg) scale(1.1)}70%{transform:rotate(12deg) scale(1.1)}}@keyframes leap{0%,10%{transform:translate(0,0)}32%{transform:translate(-100px,-95px) rotate(-15deg)}55%{transform:translate(-110px,-115px)}80%{transform:translate(0,-65px)}100%{transform:translate(0,0)}}@keyframes flight{0%,15%{transform:translate(0,0)}35%{transform:translate(30px,-65px) rotate(-8deg)}65%{transform:translate(120px,-110px) rotate(7deg)}90%{transform:translate(180px,-45px)}100%{transform:translate(0,0)}}@keyframes glitter{0%{opacity:0;transform:translateY(-30px)}30%{opacity:1}100%{opacity:0;transform:translateY(70px)}}@media(prefers-reduced-motion:reduce){.celebrate .kitten,.celebrate .dragon,.pet .kitten,.celebrate .confetti{animation:none}.speech{font-size:1.1rem}}
</style></head><body><main><h1>🐉 Household Haven 🐈</h1><p>A tiny, entirely fictional bill-payment celebration laboratory.</p><div id="stage" class="stage"><div id="speech" class="speech">Tap the kitten to say hello!</div><div class="confetti"></div><div class="creature dragon" aria-label="Baby dragon">🐉</div><div id="kitten" class="creature kitten" role="button" tabindex="0" aria-label="Pet kitten">🐈</div></div><div class="status" id="status" aria-live="polite">⚡ Test electricity bill: $125 · Unpaid</div><div class="controls"><button class="secondary" id="pet">Pet kitten</button><button class="secondary" id="costume">Bunny outfit: Off</button><button id="pay">Mark test bill paid</button><button class="secondary" id="replay" disabled>Replay celebration</button><button class="secondary" id="reset">Reset test</button></div><p style="font-size:.8rem">Demo only. No financial data is stored or transmitted. Replay never changes payment state.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),speech=$('speech');let paid=false,bunny=false,busy=false,timer;function say(t){speech.textContent=t}function pet(){if(busy)return;stage.classList.remove('pet');void stage.offsetWidth;stage.classList.add('pet');say(bunny?'The bunny-kitten wiggles its floppy ears!':'Prrrr! The kitten likes you!');setTimeout(()=>stage.classList.remove('pet'),650)}function celebration(){if(busy)return;busy=true;stage.classList.remove('celebrate');void stage.offsetWidth;stage.classList.add('celebrate');say(bunny?'Bunny-kitten leaps onto the dragon! ✨':'Kitten and dragon take flight! ✨');clearTimeout(timer);timer=setTimeout(()=>{stage.classList.remove('celebrate');say('Victory! Tap Replay to see it again.');busy=false},3900)}$('pet').onclick=pet;$('kitten').onclick=pet;$('kitten').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}};$('costume').onclick=()=>{bunny=!bunny;stage.classList.toggle('bunny',bunny);$('costume').textContent='Bunny outfit: '+(bunny?'On':'Off');say(bunny?'Floppy ears equipped!':'Classic kitten restored!')};$('pay').onclick=()=>{if(paid)return;paid=true;$('status').textContent='✅ Test electricity bill: $125 · Paid';$('pay').disabled=true;$('replay').disabled=false;celebration()};$('replay').onclick=celebration;$('reset').onclick=()=>{clearTimeout(timer);busy=false;paid=false;stage.classList.remove('celebrate','pet');$('status').textContent='⚡ Test electricity bill: $125 · Unpaid';$('pay').disabled=false;$('replay').disabled=true;say('Ready for another test!')}})();
</script></body></html>
